<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovy Vibes</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <nav>
    <div class="logo">Groovy Vibes</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
  </nav>
  <section id="shop">
    <header>Shop the Groove</header>
    <div class="categories">
      <select>
        <option>Clothing</option>
        <option>Vinyl</option>
        <option>Decor</option>
      </select>
    </div>
    <div class="flash-sale">Flash Sale: 15% off all tie-dye tees!</div>
    <div class="product-grid">
      <div class="product">
        <img src="img/tie_dye.jpeg" alt="Tie-Dye Shirt">
        <div class="product-name">Tie-Dye Shirt</div>
        <div class="price">$25</div>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="img/bell_bottom.jpeg" alt="Bell Bottoms">
        <div class="product-name">Bell Bottoms</div>
        <div class="price">$40</div>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="img/sunnies.jpg" alt="Retro Sunglasses">
        <div class="product-name">Retro Sunglasses</div>
        <div class="price">$15</div>
        <button>Add to Cart</button>
      </div>
    </div>
    <footer>
        <p>Stay Funky ✌️</p>
        <input type="email" placeholder="Enter your email">
        <button>Subscribe</button>
      </footer>
    </section>
</body>
</html>
